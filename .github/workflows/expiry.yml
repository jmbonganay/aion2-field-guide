name: Expiry sweep

# Time-limited pages (events, passes, transfer periods) carry an `expiresAt`.
# The site is static, so an expired page only disappears on the next build.
# Hourly, this logs newly expired records and pushes only when something
# expired — that push makes Vercel rebuild without the expired page.
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run content:expiry-sweep
      - name: Commit if anything expired
        run: |
          if git diff --quiet -- src/content/expiry-log.json 2>/dev/null && [ -z "$(git status --porcelain src/content/expiry-log.json)" ]; then
            echo "Nothing expired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/expiry-log.json
          git commit -m "Expiry sweep: remove expired time-limited pages"
          git push
